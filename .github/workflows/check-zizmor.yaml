# $schema: https://json.schemastore.org/github-workflow.json

name: Check - GitHub Actions Security Analysis with zizmor 🌈

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "**" ]

permissions: {}

jobs:
  zizmor:
    name: Run zizmor
    uses: rbrownwsws/actions-workflows/.github/workflows/check-zizmor.yaml@ad6895fc1e98a26860083d496fe70ad581d14b10 # v1.0.3
    permissions:
      security-events: write  # to upload results to GitHub Advanced Security
