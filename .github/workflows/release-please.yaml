# $schema: https://json.schemastore.org/github-workflow.json

name: Run release-please

on:
  push:
    branches:
      - master

permissions: {}

jobs:
  release-please:
    name: release-please
    uses: rbrownwsws/actions-workflows/.github/workflows/release-please.yaml@06b4fadb81ca7c86a3a89deb9f4ffab03e1cb1a9 # v1.0.5
    with:
      app-client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
    secrets:
      app-private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
