# $schema: https://json.schemastore.org/github-workflow.json

name: Check - GitHub Actions Security Analysis with zizmor 🌈

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "**" ]

permissions: {}

jobs:
  zizmor:
    name: Run zizmor
    uses: rbrownwsws/actions-workflows/.github/workflows/check-zizmor.yaml@06b4fadb81ca7c86a3a89deb9f4ffab03e1cb1a9 # v1.0.5
    permissions:
      security-events: write  # to upload results to GitHub Advanced Security
